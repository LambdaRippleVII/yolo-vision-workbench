<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 128 128">
  <title>YOLO Vision Workbench — 应用图标</title>
  <defs>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="6" y1="6" x2="46.6" y2="122">
      <stop offset="0" stop-color="#1B2532"/>
      <stop offset="1" stop-color="#0C121B"/>
    </linearGradient>
    <linearGradient id="amber" gradientUnits="userSpaceOnUse" x1="22" y1="12" x2="102" y2="112">
      <stop offset="0" stop-color="#FFC247"/>
      <stop offset="1" stop-color="#F29311"/>
    </linearGradient>
  </defs>

  <!-- 磁贴 -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#ink)"/>
  <rect x="6.75" y="6.75" width="114.5" height="114.5" rx="29.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5"/>

  <!-- 取景框：左上 / 右下两段断角 -->
